<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3" />
    </linearGradient>
    <radialGradient id="sphereGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid lines -->
  <g stroke="url(#lineGrad)" stroke-width="1" fill="none">
    <!-- Horizontal lines -->
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>
  
  <!-- Diagonal lines tech effect -->
  <g stroke="url(#lineGrad)" stroke-width="0.5" fill="none" opacity="0.5">
    <line x1="0" y1="0" x2="400" y2="400"/>
    <line x1="200" y1="0" x2="600" y2="400"/>
    <line x1="400" y1="0" x2="800" y2="400"/>
    <line x1="600" y1="0" x2="1000" y2="400"/>
    <line x1="800" y1="0" x2="1200" y2="400"/>
    <line x1="1000" y1="0" x2="1200" y2="200"/>
  </g>
  
  <!-- Decorative circles/spheres -->
  <circle cx="200" cy="200" r="80" fill="url(#sphereGrad)" stroke="rgba(96, 165, 250, 0.3)" stroke-width="2"/>
  <circle cx="1000" cy="150" r="60" fill="url(#sphereGrad)" stroke="rgba(167, 139, 250, 0.3)" stroke-width="2"/>
  <circle cx="800" cy="300" r="40" fill="url(#sphereGrad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="2"/>
  
  <!-- Floating particles -->
  <g fill="rgba(96, 165, 250, 0.6)">
    <circle cx="150" cy="80" r="3"/>
    <circle cx="350" cy="120" r="2"/>
    <circle cx="550" cy="60" r="4"/>
    <circle cx="750" cy="180" r="2"/>
    <circle cx="950" cy="250" r="3"/>
    <circle cx="1100" cy="100" r="2"/>
    <circle cx="100" cy="320" r="3"/>
    <circle cx="450" cy="350" r="2"/>
    <circle cx="650" cy="280" r="4"/>
    <circle cx="1050" cy="350" r="3"/>
  </g>
  
  <!-- Tech frame rectangles -->
  <rect x="100" y="50" width="200" height="100" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="2"/>
  <rect x="900" y="250" width="150" height="80" fill="none" stroke="rgba(129, 140, 248, 0.2)" stroke-width="2"/>
</svg>