<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="50%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#logoGrad)" stroke-width="2"/>
  
  <!-- 3D cube wireframe -->
  <g stroke="url(#logoGrad)" stroke-width="2" fill="none">
    <!-- Front face -->
    <polygon points="40,45 88,45 88,93 40,93"/>
    <!-- Top face -->
    <polygon points="40,45 64,30 88,45"/>
    <!-- Side face -->
    <polygon points="88,45 88,93 100,78 100,30"/>
  </g>
  
  <!-- Tech dots -->
  <g fill="url(#logoGrad)">
    <circle cx="40" cy="45" r="3"/>
    <circle cx="88" cy="45" r="3"/>
    <circle cx="88" cy="93" r="3"/>
    <circle cx="40" cy="93" r="3"/>
    <circle cx="64" cy="30" r="3"/>
    <circle cx="100" cy="30" r="3"/>
    <circle cx="100" cy="78" r="3"/>
  </g>
  
  <!-- Inner glow effect -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.3"/>
</svg>